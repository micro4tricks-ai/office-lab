# Office Lab, full version: the site + the conversion API + Gotenberg (LibreOffice/Chromium).
#   docker compose -f deploy/docker-compose.yml up -d --build      → http://localhost
# Settings live in deploy/.env (copy .env.example). See deploy/HOSTINGER.md for a VPS.
name: office-lab

services:
  caddy:
    build:
      context: ..
      dockerfile: deploy/Caddy.Dockerfile
      args:
        PUBLIC_SITE_ORIGIN: ${SITE_ORIGIN:-}
    # Another proxy already on 80/443 (a second app on the same server)? Set HTTP_PORT/HTTPS_PORT.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    mem_limit: 256m
    environment:
      DOMAIN: ${DOMAIN:-:80}
      BODY_MAX: ${BODY_MAX:-130MB}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, internal]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ../server
    environment:
      MAX_MB: ${MAX_MB:-100}
      RETENTION_MIN: ${RETENTION_MIN:-60}
      RATE_LIMIT: ${RATE_LIMIT:-30/minute}
      API_KEYS: ${API_KEYS:-}
      KEY_RATE_LIMIT: ${KEY_RATE_LIMIT:-120/minute}
      CONCURRENCY: ${CONCURRENCY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GOTENBERG_URL: http://gotenberg:3000
    volumes:
      - jobs:/work
    tmpfs:
      - /tmp:size=64m
    # Caps so a busy day can't starve other programs on the same server (deploy/HOSTINGER.md §9).
    mem_limit: ${API_MEM:-2g}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Only Caddy can reach it; it has no route to the internet.
    networks: [internal]
    depends_on: [gotenberg]
    restart: unless-stopped

  # Professional translation (Claude). The same image as the API, but on its own: it holds the API key
  # and may reach the internet, while the converters stay offline. Without ANTHROPIC_API_KEY it only
  # answers "not available" (the free translation runs in the browser).
  translate:
    build: ../server
    command: ["uvicorn", "app.translate:app", "--host", "0.0.0.0", "--port", "8001", "--proxy-headers", "--forwarded-allow-ips", "*"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/translate/status')"]
      interval: 30s
      timeout: 5s
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:-claude-sonnet-5-5}
      PRO_DAILY_CHARS: ${PRO_DAILY_CHARS:-300000}
    tmpfs:
      - /tmp:size=16m
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal, egress]
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8.37.0@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769
    command:
      - gotenberg
      - --api-timeout=300s
      - --log-level=warn
      # SSRF guards: web pages and documents may not reach private/internal addresses.
      - --chromium-deny-private-ips
      - --libreoffice-deny-private-ips
      - --chromium-clear-cache
      - --chromium-clear-cookies
      - --webhook-disable
      - --api-disable-download-from
      - --prometheus-disable-collect
    mem_limit: ${GOTENBERG_MEM:-2g}
    security_opt: ["no-new-privileges:true"]
    # internal: talks to the API; egress: fetches public pages for URL → PDF.
    networks: [internal, egress]
    restart: unless-stopped

  # Optional uptime monitor: docker compose --profile monitoring up -d
  # Open it through an SSH tunnel: ssh -L 3001:127.0.0.1:3001 root@SERVER → http://localhost:3001
  uptime-kuma:
    image: louislam/uptime-kuma:2@sha256:9912da7d7d9b6ddc0c2d904beb84d24689c1ed9c33b81419eb9008663a92a329
    profiles: [monitoring]
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - kuma:/app/data
    networks: [edge, internal]
    restart: unless-stopped

networks:
  internal:
    internal: true
  edge: {}
  egress: {}

volumes:
  caddy_data: {}
  caddy_config: {}
  jobs: {}
  kuma: {}
